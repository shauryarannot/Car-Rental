spring.application.name=carrental
spring.datasource.url=jdbc:h2:mem:carrental
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
# Load sample data on startup when the DB is empty (config/DataSeeder.java)
app.seed.enabled=true
spring.jpa.show-sql=false


# JWT signing key: must be at least 32 characters. Change it for any real deployment.
app.jwt.secret=${JWT_SECRET:change-this-dev-secret-at-least-32-characters}
app.jwt.expiry-minutes=120

# First admin account, created on startup if it does not exist
app.admin.email=${ADMIN_EMAIL:admin@carrental.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}