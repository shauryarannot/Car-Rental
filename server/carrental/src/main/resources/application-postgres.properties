# Activate with the profile "postgres" (see README / run steps).
# Credentials come from environment variables so they never get committed.
#   DB_URL      optional, defaults to the local postgres database
#   DB_USERNAME optional, defaults to postgres
#   DB_PASSWORD required
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Mtc@1234}

# The tables are created by database/schema.sql. Hibernate only checks that
# the entities match them and refuses to start if they don't. It never changes the tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Sample data is OFF for a real database. Set APP_SEED=true once to load demo data into an empty one.
app.seed.enabled=${APP_SEED:false}